name: Deploy Vyndra storefront

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/deploy-storefront.yml
      - .github/scripts/deploy_storefront.py
      - wp-content/mu-plugins/vyndra-storefront.php
      - wp-content/mu-plugins/vyndra-storefront/**
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vyndra-storefront-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Upload storefront to Hostinger
        env:
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: python3 .github/scripts/deploy_storefront.py
